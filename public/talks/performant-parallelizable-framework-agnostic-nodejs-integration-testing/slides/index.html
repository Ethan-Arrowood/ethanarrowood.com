<!doctype html>
<!--
  Redirect from the original slides URL, which was shared before slides moved
  under a per-event path. Keeps the #hash so links to a specific slide still work.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Slides moved</title>
		<link
			rel="canonical"
			href="https://ethanarrowood.com/talks/performant-parallelizable-framework-agnostic-nodejs-integration-testing/nodejs-interactive-render-atl-2026/slides/"
		/>
		<script>
			location.replace(
				"../nodejs-interactive-render-atl-2026/slides/" +
					location.search +
					location.hash,
			);
		</script>
		<meta
			http-equiv="refresh"
			content="0; url=../nodejs-interactive-render-atl-2026/slides/"
		/>
	</head>
	<body>
		<p>
			These slides moved to
			<a href="../nodejs-interactive-render-atl-2026/slides/"
				>Node.js Interactive @ Render ATL 2026 slides</a
			>.
		</p>
	</body>
</html>
