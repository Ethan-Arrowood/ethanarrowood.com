name: Check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The pull request merge commit plus its first parent (the base),
          # so media:check can diff against the base.
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check media is append-only
        run: npm run media:check -- HEAD^1
      - name: Build
        run: npm run build
